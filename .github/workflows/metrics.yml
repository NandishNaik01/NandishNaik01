# Regenerates assets/metrics.svg (activity + languages) daily. Replaces the public
# github-readme-stats instance, which is rate-limited and often returns 503.
# Needs a METRICS_TOKEN secret: a classic PAT with read:user (GITHUB_TOKEN can't read the profile).
name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: assets/metrics.svg
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
